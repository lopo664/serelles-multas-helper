<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generador de cadenas para multas del equipo.">
    <title>Multas del equipo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="app-shell">
        <nav class="view-nav" aria-label="Vistas del generador">
            <button id="previous-fines-view-button" class="view-button is-active" type="button"
                aria-controls="previous-fines-panel" aria-selected="true">
                <span>01</span> Multas anteriores
            </button>
            <button id="paid-fines-view-button" class="view-button" type="button" aria-controls="paid-fines-panel"
                aria-selected="false">
                <span>02</span> Multas pagadas
            </button>
            <button id="form-view-button" class="view-button" type="button" aria-controls="form-panel"
                aria-selected="false">
                <span>03</span> Nueva multa
            </button>
            <button id="result-view-button" class="view-button" type="button" aria-controls="preview-panel"
                aria-selected="false">
                <span>04</span> Resultado
            </button>
        </nav>

        <section class="workspace" aria-label="Generador de multas">
            <div id="previous-fines-panel" class="previous-fines-panel view-panel is-active">
                <div class="section-heading section-heading-compact">
                    <span class="step-number step-number-light">01</span>
                    <h2>Multas anteriores</h2>
                </div>
                <p class="panel-copy">Pega aquí una cadena previa con el mismo formato del resultado.</p>
                <textarea id="previous-fines-input" class="paste-area" rows="12"
                    placeholder="Lunes - 04/09/2026&#10;Pablito - Retraso - 1€&#10;Adri Sanz - Ropa - 1€"></textarea>
                <button id="load-previous-fines-button" class="secondary-button" type="button">Cargar multas</button>
            </div>

            <div id="paid-fines-panel" class="paid-fines-panel view-panel">
                <div class="section-heading section-heading-compact">
                    <span class="step-number step-number-light">02</span>
                    <h2>Multas pagadas</h2>
                </div>
                <p class="panel-copy">Marca las líneas que ya están pagadas. Se mostrarán con ~ delante y detrás.</p>
                <div id="paid-date-label" class="paid-date-label"></div>
                <div id="paid-lines" class="paid-lines"></div>
                <div class="paid-actions">
                    <button id="paid-to-form-button" class="secondary-button" type="button">Nueva multa</button>
                    <button id="paid-to-result-button" class="secondary-button" type="button">Resultado</button>
                </div>
            </div>

            <div id="form-panel" class="form-panel view-panel">
                <form id="fine-form">
                    <div class="field-group">
                        <label class="date-label" for="date">Fecha</label>
                        <input id="date" name="date" type="date" required aria-label="Seleccionar fecha">
                    </div>

                    <div class="field-group">
                        <label id="person-label">Personas</label>
                        <div id="person-options" class="choice-grid people-grid" role="group"
                            aria-labelledby="person-label"></div>
                    </div>

                    <div class="field-group">
                        <label id="fine-label">Tipos de multa</label>
                        <div id="fine-options" class="choice-grid fines-grid" role="group" aria-labelledby="fine-label">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button class="generate-button" type="submit">
                            <span>Generar cadena</span>
                            <span class="button-arrow" aria-hidden="true">↗</span>
                        </button>
                        <button id="clear-button" class="clear-button" type="button">
                            <span class="clear-icon" aria-hidden="true">×</span>
                            <span>Borrar</span>
                        </button>
                    </div>
                </form>
            </div>

            <div id="preview-panel" class="preview-panel view-panel">
                <div class="preview-topline">
                    <div class="section-heading">
                        <span class="step-number step-number-light">04</span>
                        <h2>Cadena generada</h2>
                    </div>
                    <span class="status-dot"><span></span> LISTO</span>
                </div>

                <div class="output-wrap">
                    <p class="output-label">RESULTADO</p>
                    <output id="result" class="result" aria-live="polite"></output>
                </div>

                <button id="copy-button" class="copy-button" type="button" disabled>
                    <span class="copy-icon" aria-hidden="true">▣</span>
                    <span id="copy-label">Copiar al portapapeles</span>
                </button>
                <p id="copy-feedback" class="copy-feedback" aria-live="polite"></p>
            </div>
        </section>

        <footer class="footer"><span>CONTROL INTERNO</span><span>·</span><span id="current-year"></span></footer>
    </main>
    <script src="app.js"></script>
</body>

</html>
